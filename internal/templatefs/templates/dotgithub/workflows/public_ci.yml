name: CI

on:
  push:
    branches: ["{{.DefaultBranch}}"]
  pull_request:
    branches: ["{{.DefaultBranch}}"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.15.0

  # Lint on Windows as well — golangci-lint can fail on path separators,
  # case-sensitivity, and CRLF while passing on Linux, so the matrix must
  # cover it. Required context "Lint (Windows)"; keep branch protection in
  # sync when adding/renaming jobs (see AGENTS.md).
  lint-windows:
    name: Lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.15.0

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build:
    name: Build
    strategy:
      # Full 3-OS matrix on push to the default branch; PRs skip macOS (10x minutes
      # on the free tier) — Linux + Windows already cover the cross-platform risk.
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - run: go vet ./...

  test:
    name: Test
    strategy:
      fail-fast: false  # one leg failing must not cancel the others' coverage uploads
      # Full 3-OS matrix on push to the default branch; PRs skip macOS to conserve minutes.
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so Codecov can walk git history for path mapping and so
      # parent/base SHAs exist when the App compares PR head vs the default branch
      # (avoids "Missing base commit" / unusable reports on shallow clones).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Run in bash on every OS so the working directory and tooling are
      # consistent. Go on the Windows runner writes coverage.out with CRLF line
      # endings, which Codecov's parser rejects (the upload lands in an ERROR
      # state and never merges), so strip CR in the same step. tr is identical
      # on GNU/BSD/Git-bash; the strip is a no-op on Linux/macOS.
      - name: Run tests with coverage
        shell: bash
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          tr -d '\r' < coverage.out > coverage.tmp && mv coverage.tmp coverage.out
      # JUnit XML for Codecov Test Analytics — Linux only (gotestsum).
      - name: Install gotestsum (Linux)
        if: runner.os == 'Linux'
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Generate JUnit XML (Linux)
        if: runner.os == 'Linux'
        run: gotestsum --junitfile junit.xml --format pkgname -- ./...
      # Hand the reports to the privileged upload jobs as artifacts. The test
      # job runs untrusted PR code, so it holds no OIDC token and no Codacy
      # token — the coverage-upload and codacy-upload jobs run only on the
      # trusted default-branch push and pick these up there.
      - name: Save coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            junit.xml
          if-no-files-found: error

  # Codecov upload, split out of the test job so the OIDC token
  # (id-token: write) is never granted to a job that runs untrusted PR code.
  # Runs only on the trusted default-branch push; PR coverage diffs are still
  # computed by Codecov against this base report.
  coverage-upload:
    name: Coverage upload
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
      id-token: write  # OIDC; mints the Codecov upload token
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-${{ matrix.os }}
      # Upload per-OS coverage so Codecov merges all legs. A Linux-only report
      # understates true coverage; merging the OS matrix reflects it.
      # use_pypi: true — install CLI from PyPI instead of cli.codecov.io so we
      # skip native-binary GPG verification (fails with "Could not verify
      # signature" when key import is empty; codecov/codecov-action#1876).
      # fail_ci_if_error: false — Codecov is a soft gate; infra flakiness
      # must not fail the workflow and block valid pushes.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          use_pypi: true
          files: ./coverage.out
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          use_pypi: true
          report_type: test_results
          files: ./junit.xml
          fail_ci_if_error: false

  # Codacy upload, moved out of the privileged workflow_run forwarder into a
  # push-only job here. Runs only on the trusted default-branch push and reads
  # the token from the `codacy` environment, which should be restricted to the
  # default branch (see GITHUB_SETTINGS.md) so PRs can never reach the secret.
  codacy-upload:
    name: Codacy upload
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: codacy
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-ubuntu-latest
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        env:
          CODACY_COMMIT_UUID: ${{ github.sha }}
        with:
          project-token: ${{ secrets.CODACY_REPOSITORY_API_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go
          language: Go

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gosec
        # Keep this -exclude set in sync with .golangci.yml gosec.excludes
        # (single source of truth) so gosec and golangci suppress the same IDs.
        # Adjust the set to match the target repo's .golangci.yml.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude=G104,G204,G304,G704 ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
