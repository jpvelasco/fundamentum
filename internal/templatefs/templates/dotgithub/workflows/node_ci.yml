name: CI

on:
  push:
    branches: ["{{.DefaultBranch}}"]
  pull_request:
    branches: ["{{.DefaultBranch}}"]

permissions:
  contents: read

# Node pack. Lint/Test run the scripts detected in package.json; a missing
# script fails the job with a configure-me annotation instead of passing
# vacuously — a required check that skips silently would be false confidence.
# npm ci (and setup-node's npm cache) require package-lock.json or
# npm-shrinkwrap.json. Repos that only have package.json use npm install
# with caching disabled so the required Lint/Test checks can still report.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: "${{ steps.lockfile.outputs.present == 'true' && 'npm' || '' }}"
      - shell: bash
        env:
          NPM_LOCKFILE: "${{ steps.lockfile.outputs.present }}"
        run: |
          if [ "$NPM_LOCKFILE" = "true" ]; then
            npm ci
          else
            npm install
          fi
      - run: '{{.NodeLintCommand}}'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: "${{ steps.lockfile.outputs.present == 'true' && 'npm' || '' }}"
      - shell: bash
        env:
          NPM_LOCKFILE: "${{ steps.lockfile.outputs.present }}"
        run: |
          if [ "$NPM_LOCKFILE" = "true" ]; then
            npm ci
          else
            npm install
          fi
      - run: '{{.NodeTestCommand}}'

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
