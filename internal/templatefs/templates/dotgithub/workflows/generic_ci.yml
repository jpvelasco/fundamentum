name: CI

on:
  push:
    branches: ["{{.DefaultBranch}}"]
  pull_request:
    branches: ["{{.DefaultBranch}}"]

permissions:
  contents: read

# Minimal pack for repos with no detected language manifests. The CI job
# DELIBERATELY FAILS until real build/test commands are configured — a
# required check that passes vacuously would give false confidence.
# Replace the "Configure CI" step with the project's real commands, or ship
# a language pack instead (--ci go/node/python/rust).
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Configure CI
        run: |
          echo "::error::No build/test commands detected for this repository."
          echo "::error::Edit .github/workflows/ci.yml to run the project's real build/test commands, then delete this step."
          exit 1

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
