# Octopus Review — third-party AI PR review. OPT-IN: this workflow was
# installed with an explicit --octopus flag because, on pull_request_target,
# it uploads the PR diff plus a PR-write token to https://octopus-review.ai.
# Delete this file to stop sharing PR data with the service.
name: Octopus Review
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # On pull_request_target this action uploads the PR diff + GITHUB_TOKEN (scoped to contents:read, pull-requests:write) to https://octopus-review.ai for review.
      - uses: octopusreview/action@c7156c0dc465c20e8b06da84b92b64f9ae8c7c36
