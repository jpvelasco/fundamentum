# Codecov configuration. See https://docs.codecov.com/docs/codecov-yaml
#
# Upload: every Test matrix leg in .github/workflows/ci.yml (OIDC + optional
# CODECOV_TOKEN). No override_* params are sent: the action derives commit and
# branch from the checkout (fetch-depth: 0 in ci.yml), and push-to-main runs
# upload the base report Codecov stores for PR comparison (docs.codecov.com/
# docs/error-reference for what happens when the base report is missing).
#
# PR visibility: Codecov GitHub App posts `codecov/patch` + often a PR comment
# only after BOTH base (main) and head reports process. codecov/project often
# never posts (probe PR #25). Branch protection requires `codecov/patch` only —
# soft gate, kept resilient to App lag/outage.
#
# Gates:
#   - project: overall coverage may not drop more than the threshold vs base
#   - patch:   new/changed lines in a PR must meet the target (90%)
coverage:
  status:
    project:
      default:
        target: auto        # compare against the base commit's coverage
        threshold: 1%        # tolerate <=1% drift before failing
        if_not_found: success
    patch:
      default:
        target: 90%          # new/changed lines must be >=90% covered (no new
                             # function ships untested; strive for 100%)
        if_not_found: success

# Inline annotations on the PR Files tab (when the GitHub App is installed).
github_checks:
  annotations: true

# Virtual coverage groupings by path — no upload changes required. Lets the
# dashboard and PR comment break coverage down by architectural layer.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: cmd
      name: cmd (CLI layer)
      paths:
        - cmd/**
    - component_id: internal
      name: internal (core)
      paths:
        - internal/**

comment:
  layout: "reach, diff, flags, components, files"
  behavior: default
  require_changes: false     # still comment when coverage is unaffected (docs PRs)

# Paths excluded from coverage math.
ignore:
  - "**/*_test.go"
