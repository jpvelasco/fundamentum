# Octopus Review — third-party AI PR review. OPT-IN: this workflow runs on
# `pull_request` (NOT the privileged `pull_request_target`), so the job checks
# out and runs against the PR's own code with the standard, un-privileged
# GITHUB_TOKEN. It still uploads the PR diff plus a PR-write token to
# https://octopus-review.ai — the `pull-requests: write` grant below is what
# lets it post review comments. Because the job runs PR code, a malicious PR
# could exfiltrate that token or push review comments; fork PRs get a
# read-only token from GitHub by default, which blunts but does not remove
# the risk for same-repo PRs. Delete this file to opt out.
name: Octopus Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # lets the action post review comments on the PR
    steps:
      # On pull_request this action uploads the PR diff + GITHUB_TOKEN (scoped
      # to contents:read, pull-requests:write) to https://octopus-review.ai
      # for review. See the header comment for the risk trade-off.
      - uses: octopusreview/action@c7156c0dc465c20e8b06da84b92b64f9ae8c7c36
