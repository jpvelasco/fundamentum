name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm (trusted publishing needs >=11.5.1)
        run: npm install -g npm@11.21.0

      - name: Copy binaries into platform packages
        run: node npm/copy-binaries.js dist/artifacts.json npm/packages

      # Platform packages publish first so a failure never ships a launcher
      # whose pinned binaries are missing. Already-published versions are
      # skipped so a partially failed release can be re-run.
      - name: Publish platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in npm/packages/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} already published; skipping"
              continue
            fi
            (cd "$dir" && npm version "$VERSION" --no-git-tag-version && npm publish --access public)
          done

      - name: Publish npm package
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = v;
            for (const d of Object.keys(p.optionalDependencies)) p.optionalDependencies[d] = v;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$VERSION"
          npm publish --access public
